  <!-- This dashboard depends on four libraries from cdnjs. On a corporate
       network that blocks CDNs, every one of them fails and the visitor gets a
       blank frame where the strongest artifact on the site should be. Say what
       happened instead, and point at the written version of the same findings. -->
  <noscript>
    <div class="dash-fallback">

  <script>
    (function () {
      var missing = [];
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') missing.push('React');
      if (typeof Recharts === 'undefined') missing.push('Recharts');
      if (typeof Babel === 'undefined') missing.push('Babel');
      if (!missing.length) return;

      var root = document.getElementById('root');
      if (!root) return;
      var wrap = document.createElement('div');
      wrap.className = 'dash-fallback';

      var h = document.createElement('h1');
      h.textContent = 'The dashboard could not load';
      var p1 = document.createElement('p');
      p1.textContent = 'It renders with ' + missing.join(' and ') +
        ', loaded from cdnjs.cloudflare.com. Something on this network blocked that request.';
      var p2 = document.createElement('p');
      p2.textContent = 'The same findings are written out in full on the portfolio, charts included.';
      var p3 = document.createElement('p');
      var a = document.createElement('a');
      a.href = 'index.html#cyberpunk-analytics';
      a.textContent = 'Read the analytics case study';
      p3.appendChild(a);

      wrap.appendChild(h); wrap.appendChild(p1); wrap.appendChild(p2); wrap.appendChild(p3);
      root.appendChild(wrap);
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext } = React;
    const {

    // ─── RESPONSIVE ──────────────────────────────────────────────────────
    // This page is embedded in an iframe on the portfolio, so matchMedia here
    // reports the *iframe's* width, not the device's. That's what we want:
    // the layout should react to the box it's actually drawn in.
    function useMediaQuery(query) {
      const [matches, setMatches] = useState(() => window.matchMedia(query).matches);
      useEffect(() => {
        const mql = window.matchMedia(query);
        const onChange = e => setMatches(e.matches);
        setMatches(mql.matches);
        // addListener is the pre-Safari-14 spelling. Falling back matters here:
        // an uncaught TypeError in this hook takes the whole dashboard down to
        // a blank iframe rather than degrading to the desktop layout.
        if (mql.addEventListener) {
          mql.addEventListener("change", onChange);
          return () => mql.removeEventListener("change", onChange);
        }
        mql.addListener(onChange);
        return () => mql.removeListener(onChange);
      }, [query]);
      return matches;
    }

    // narrow = stack two-column layouts and shorten labels
    const LayoutContext = createContext({ narrow: false });
    const useLayout = () => useContext(LayoutContext);

    // Multiplier changes (from price changes.csv)
    const multiplierChanges = [
      { name: "Passive Upgrade Mult.", old: 5.0, now: 3.5 },
      { name: "Clicker Upgrade Mult.", old: 10.0, now: 7.0 },
      { name: "Offline Multiplier", old: 1000, now: 150 },

    // Cumulative upgrade-purchase cost: base 150 (passive upgrade T1), old 5x vs new 3.5x scaling
    const upgradeCostCurve = (() => {
      const out = [];
      const base = 150;
      for (let n = 0; n <= 10; n++) {
        out.push({
          n,
          old: Math.round(base * Math.pow(5, n)),
          now: Math.round(base * Math.pow(3.5, n)),
        });
      }
      return out;
    })();

    // Offline reward simulation. Baseline CPS = 1 credit/sec throughout.
    //
    // Shipped mechanic: reward = CPS * min(hours, window) * rate * multiplier.
    // A fresh account starts at rate 10% with a 1h window and a 1x multiplier.
    // Three separate building lines raise each one independently, to ceilings of
    // 75%, 8h and 2x. The post-fix curves plotted here are accounts we can point
    // at: the starting state (every fresh save is still on 1x), the deepest
    // player in the after-1.40 cohort (40% / 3h / 1.2x, from field telemetry),
    // and the ceiling nobody has reached.
    //
    // The pre-fix curve is illustrative, not measured. offlineBonus was baked
    // into offlinePercentage and multiplied a second time in
    // CalculateProduction(), so the effective bonus was Pow(2,n) squared. This
    // plots n = 5 with no time cap. The ~38,000x headline is the late-game case,
    // at a higher upgrade count than this chart shows.
    const OFFLINE = {
      rateStart: 0.10, rateCap: 0.75,
      timeStart: 1,    timeCap: 8,
      multStart: 1,    multCap: 2,
      // deepest observed player, after-1.40 cohort
      deepRate: 0.40,  deepTime: 3,   deepMult: 1.2,
    };

    const offlineSim = (() => {
      const out = [];
      const cps = 1, preUpgrades = 5;
      const preBonus = Math.pow(Math.pow(2, preUpgrades), 2); // applied twice
      const reward = (h, rate, window, mult = 1) =>
        Math.round(cps * Math.min(h, window) * 3600 * rate * mult);
      for (let h = 0.25; h <= 12; h += h < 4 ? 0.25 : 1) {
        out.push({
          h: +h.toFixed(2),
          pre: Math.round(cps * h * 3600 * OFFLINE.rateStart * preBonus),
          fresh: reward(h, OFFLINE.rateStart, OFFLINE.timeStart, OFFLINE.multStart),
          deep: reward(h, OFFLINE.deepRate, OFFLINE.deepTime, OFFLINE.deepMult),
          ceiling: reward(h, OFFLINE.rateCap, OFFLINE.timeCap, OFFLINE.multCap),
        });
      }
      return out;
    })();

    // Events: pre-1.40 vs after-1.40 param counts

    // ─── COUNTRY DATA ────────────────────────────────────────────────────

    // ─── HELPERS ─────────────────────────────────────────────────────────
    const fmt = (v) => {
      if (v == null) return "—";
      const abs = Math.abs(v);
      if (abs >= 1e12) return `${(v/1e12).toFixed(1)}T`;
      if (abs >= 1e9) return `${(v/1e9).toFixed(1)}B`;
      if (abs >= 1e6) return `${(v/1e6).toFixed(1)}M`;
      if (abs >= 1e3) return `${(v/1e3).toFixed(1)}K`;

    };

    const fmtSec = (s) => {
      if (s < 60) return `${s}s`;
      const m = s / 60;
      if (m < 60) return `${m.toFixed(1)} min`;
      return `${(m/60).toFixed(1)} h`;

    window.addEventListener('storage', () => location.reload());

    const pt = {

      // shared

      pre_label: "Pré-1.40",
      post_label: "Pós-1.40",
      players: "jogadores",
      median: "mediana",
      mean: "média",
      // overview
      ov_subtitle: "O cohort pós-1.40 com 36 jogadores, medido contra a baseline legada congelada",
      ov_kpi_pre: "Cohort pré-1.40",
      ov_kpi_post: "Cohort pós-1.40",
      ov_kpi_fixes: "Correções enviadas",
      ov_kpi_events: "Novos eventos",
      ov_kpi_time: "Tempo até 1K",
      ov_kpi_pre_sub: "build legada",

      ov_kpi_fixes_sub: "v1.70 + v1.81",
      ov_kpi_events_sub: "instrumentados",
      ov_kpi_time_sub: "mediana, +85%",
      ov_timeline_title: "Linha do Tempo",
      ov_timeline_pre: "Build legada com três problemas conhecidos: um contador de upgrade clicker mal-mapeado, um defeito de persistência no timeElapsed e um bug de produção offline que acumulava até cerca de 38.000× a CPS normal no late game.",
      ov_timeline_post: "O overhaul da v1.70 (rebalance econômico, correção do offline, analytics expandido, fix de IAP), seguido pelas passagens de estabilização da v1.81. A v1.81 ainda é a build ao vivo e a 1.8.2 ainda está em QA. Esta leitura compara o cohort pós-1.40 como está hoje, 36 jogadores no 1K e streams de eventos na casa das centenas, contra a baseline congelada do pré-1.40.",

      // economy
      ec_intro: "O rebalance atacou a parede de progressão da build legada: os custos de upgrade. Os multiplicadores de upgrade caíram (passivo 5× → 3.5×, clicker 10× → 7×) e o multiplicador de bônus offline foi reduzido em 6.7×. Os preços base dos prédios foram na direção oposta, subindo na maioria dos tiers, como mostra a tabela abaixo. Os multiplicadores de preço de prédios em si (1.65× clicker, 1.25× passivo) permanecem inalterados. É essa assimetria que impulsiona a transição clique-para-passivo, e ela fica por design.",

          <InsightBox>{t('bh_insight', "Time-to-1K rose about 85% (194s → 360s) and clicks at 1K rose about 30% (302 → 394), while buildings bought stayed flat at 13 → 12. Players now spend longer and click more to reach the first milestone without changing what they buy, which is the gentler opening curve the rebalance was after. The mid-game stretched further still: median time-to-1M went from 824s to 3,503s, roughly 4×, and upgrades owned at 1M rose from 10 to 14 now that the cheaper curve puts them in reach. Clicker upgrades alone went from 0 to 6, since the legacy counter never worked at all. The funnel keeps its shape (1K→1M conversion 42% pre against 36% post, 1M→1B 27% against 38%). The single 1T runner spent 4.8 hours of active play across 18.8 hours of wall-clock, which is the offline caps working as intended: nobody idles their way to the top tier overnight any more.")}</InsightBox>
        </div>
      );
    }

    function GeoPanel() {
      const { narrow } = useLayout();
      const timeChart = countryActiveToK.slice().sort((a, b) => a.med - b.med).map(c => ({ code: c.code, med: c.med, n: c.n, label: `${fmtSec(c.med)} · n=${c.n}` }));

      return (
        <div>
          <SectionHeading sub={t('geo_intro', "Where each cohort's players come from, counted once per player at the 1K gate, and how quickly each country gets there. Country granularity is best effort: Unity Analytics provides ISO-2 codes derived from device locale.")}>
            {t('tab_geo', 'Geo Distribution')}
          </SectionHeading>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 22 }}>
            <StatCard label={t('geo_total_post', 'After-1.40 players')} value={postTotal.toString()} sub={t('geo_kpi_sub_post', 'reached 1K, post-overhaul builds')} accent={theme.accent} />
            <StatCard label={t('geo_total_pre', 'Pre-1.40 players')} value={preTotal.toString()} sub={t('geo_kpi_sub_pre', '45 countries · top-12 charted')} accent={theme.cyan} />
            <StatCard label={t('geo_top_post', 'Top after-1.40')} value="US + BR" sub={`${(countryDataPost[0].pct + countryDataPost[1].pct).toFixed(0)}% ${t('geo_combined', 'combined')}`} accent={theme.text} />
            <StatCard label={t('geo_top_pre', 'Top pre-1.40')} value="US + DE" sub={`37% ${t('geo_combined', 'combined')}`} accent={theme.text} />
          </div>

          <div style={{ display: "grid", gridTemplateColumns: narrow ? "1fr" : "1fr 1fr", gap: 16, marginBottom: 22 }}>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('geo_post_chart', 'After-1.40 cohort (players at 1K)')}</div>
              <ResponsiveContainer width="100%" height={chartH(narrow, 280)}>
                <BarChart data={countryDataPost} margin={{ top: 10, right: 24, bottom: 10, left: narrow ? -4 : 10 }} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} horizontal={false} />
                  <XAxis type="number" tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} />
                  <YAxis dataKey="code" type="category" width={narrow ? 34 : 44} tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="players" name={t('geo_players', 'Players')} fill={chartColors.post} radius={[0,3,3,0]}>
                    <LabelList dataKey="players" position="right" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('geo_pre_chart', 'Pre-1.40 cohort (top 12)')}</div>
              <ResponsiveContainer width="100%" height={chartH(narrow, 280)}>
                <BarChart data={countryDataPre} margin={{ top: 10, right: 24, bottom: 10, left: narrow ? -4 : 10 }} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} horizontal={false} />
                  <XAxis type="number" tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} />
                  <YAxis dataKey="code" type="category" width={narrow ? 34 : 44} tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="players" name={t('geo_players', 'Players')} fill={chartColors.pre} radius={[0,3,3,0]}>
                    <LabelList dataKey="players" position="right" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div style={{ marginBottom: 4 }}>
            <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4, fontFamily: "'Geist Mono', monospace" }}>{t('geo_time_title', 'Median active play time to 1K by country (after-1.40)')}</div>
            <div style={{ color: theme.textMuted, fontSize: 11.5, marginBottom: 10 }}>{t('geo_time_desc', 'Countries with n≥2. activePlayTime excludes idle and offline gaps, which matters here because wall-clock medians at this n are dominated by long-dormant installs.')}</div>
            <ResponsiveContainer width="100%" height={chartH(narrow, 220)}>
              <BarChart data={timeChart} margin={{ top: 16, right: narrow ? 8 : 24, bottom: 10, left: narrow ? -18 : 10 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={theme.border} />
                <XAxis dataKey="code" tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 12 }} interval={0} />
                <YAxis tickFormatter={(v) => `${(v/60).toFixed(0)}m`} tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} width={narrow ? 34 : 60} />
                <Tooltip content={<CustomTooltip />} />
                <Bar dataKey="med" name={t('geo_med_time', 'Median active time to 1K')} fill={chartColors.now} radius={[3,3,0,0]}>
                  <LabelList dataKey="label" position="top" fill={theme.textMuted} fontSize={11} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <InsightBox>{t('geo_insight', "The post cohort spreads across 15 countries at n=36, led by US at 31% and BR at 19%. US and BR were 74% of it at an earlier snapshot, so that concentration has diluted as the cohort grew. Which country looks fastest depends entirely on the clock: by wall-clock US gets to 1K first (median ~5.4 min against BR's ~7.9 min), but by active play time BR overtakes it, 3.5 min against 4.5 min. DE is quicker than both on that measure at 2.7 min, on n=4. So BR players take longer and more frequent idle gaps while needing less hands-on time, which is a difference in cadence rather than skill. At this n it is something to keep watching, not something to conclude.")}</InsightBox>
        </div>
      );
    }

    function AdsSessionsPanel() {
      const { narrow } = useLayout();
      const adChart = adByCountry.map(c => ({ code: c.code, events: c.events, label: `${c.events} (${c.pct}%)` }));

      return (
        <div>
          <SectionHeading sub={t('ads_intro', "Two event streams introduced in v1.70: AdWatched5x (rewarded video) and SessionStart. Both were thin when they first started reporting. They now carry 175 and 191 Android events, which is enough volume to read a pattern rather than an anecdote.")}>
            {t('tab_ads', 'Ads & Sessions')}
          </SectionHeading>

          <div style={{ marginBottom: 22 }}>
            <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('ads_5x_title', '5x ad watches by country (after-1.40)')}</div>
            <ResponsiveContainer width="100%" height={chartH(narrow, 240)}>
              <BarChart data={adChart} margin={{ top: 16, right: narrow ? 40 : 24, bottom: 10, left: narrow ? -4 : 10 }} layout="vertical">
                <CartesianGrid strokeDasharray="3 3" stroke={theme.border} horizontal={false} />
                <XAxis type="number" tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} />
                <YAxis dataKey="code" type="category" width={narrow ? 34 : 44} tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} />
                <Tooltip content={<CustomTooltip />} />
                <Bar dataKey="events" name={t('ads_events', 'Ad events')} fill={chartColors.post} radius={[0,3,3,0]}>
                  <LabelList dataKey="label" position="right" fill={theme.textMuted} fontSize={11} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 22 }}>
            <StatCard label={t('ads_total', 'Total 5x ads watched')} value="175" sub={t('ads_total_sub', 'after-1.40 Android cohort')} accent={theme.accent} />
            <StatCard label={t('ads_max', 'Single-player max')} value="120" sub={t('ads_max_sub', '1 DE player, 69% of total')} accent={theme.amber} />
            <StatCard label={t('ads_other', 'Events outside DE')} value="54" sub={t('ads_other_sub', 'across 8 countries')} accent={theme.text} />
          </div>

          <NoteBox color={theme.amber}>{t('ads_concentration', 'Concentration is softening but still extreme. One German player accounts for 120 of the 175 views, or 69%, down from 82% at an earlier snapshot. The DE bar reads 121 because a second German player watched exactly one. Elsewhere a US player has climbed to 21 lifetime views and the stream now spans 9 countries, up from 5. It is the same player behind both extremes: the DE ad power-user is the one who reached 1T, and their lifetime counter read 111 ads at that moment, with the 5x multiplier active. Ads as a progression route hold up at the far end of the curve. Adoption at the entry level is still thin, and the median player has watched zero by the time they hit 1K.')}</NoteBox>

          <div style={{ marginTop: 24 }}>
            <SectionHeading sub={t('sess_intro', 'SessionStart fires on every app open via the 2-frame coroutine pattern. The after-1.40 Android cohort has captured 191 events, up from 27 when the stream first opened.')}>
              {t('sess_subtitle', 'Session start patterns')}
            </SectionHeading>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: narrow ? "1fr" : "1fr 1fr", gap: 16, marginBottom: 22 }}>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('sess_number_title', 'Session number distribution')}</div>
              <ResponsiveContainer width="100%" height={chartH(narrow, 220)}>
                <BarChart data={sessionNumberHist} margin={{ top: 16, right: narrow ? 8 : 24, bottom: 10, left: narrow ? -18 : 10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} />
                  <XAxis dataKey="n" tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 11 }} />
                  <YAxis tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 12 }} width={narrow ? 34 : 60} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="count" name={t('sess_events', 'Session opens')} fill={chartColors.post} radius={[3,3,0,0]}>
                    <LabelList dataKey="count" position="top" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('sess_days_title', 'Days since install (at session)')}</div>
              <ResponsiveContainer width="100%" height={chartH(narrow, 220)}>
                <BarChart data={daysSinceInstallHist} margin={{ top: 16, right: narrow ? 8 : 24, bottom: 10, left: narrow ? -18 : 10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} />
                  <XAxis dataKey="bucket" tick={{ fill: theme.textMuted, fontSize: narrow ? 9 : 10 }} interval={0} />
                  <YAxis tick={{ fill: theme.textMuted, fontSize: narrow ? 10 : 12 }} width={narrow ? 34 : 60} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="count" name={t('sess_events', 'Session opens')} fill={theme.cyan} radius={[3,3,0,0]}>
                    <LabelList dataKey="count" position="top" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 4 }}>
            <StatCard label={t('sess_events', 'Session opens')} value="191" sub={t('sess_events_sub', 'after-1.40 Android cohort')} accent={theme.accent} />
            <StatCard label={t('sess_prev_dur', 'Median prev session')} value="1.5 min" sub={t('sess_prev_dur_sub', 'short bursts still dominate')} accent={theme.cyan} />
            <StatCard label={t('sess_med_days', 'Median days-since-install')} value="10" sub={t('sess_med_days_sub', 'opens now stretch into weeks 2-3')} accent={theme.cyan} />
            <StatCard label={t('sess_top', 'Top player session #')} value="139" sub={t('sess_top_sub', 'one US player ≈ half of all opens')} accent={theme.amber} />
          </div>

          <NoteBox color={theme.cyan}>{t('sess_note', "sessionNumber is event-weighted. Every open emits one event, so heavily retained players dominate the distribution and the median event sits at session #27. These charts show where the opens come from, not how many sessions a typical player logs. The US carries 84% of the stream.")}</NoteBox>

          <InsightBox>{t('ads_sess_insight', "Two things have shifted as these streams filled out. Ad-watching is still power-user behavior, but the base is widening: one player accounts for 69% where they used to account for 82%, and the number of countries in the stream nearly doubled. The ad ledger also connects straight to progression now, because the heaviest ad user is the same person holding the 1T record. The second change is that session opens have stopped clustering at install. Days 0-1 hold 19% of opens while days 8-24 carry 58%. Much of that is composition, since the retained few generate most of the opens, but the composition is the finding: the game has a returning core it did not have before. The short-burst pattern survived a 7× larger sample, with the median previous session still around 1.5 min. Bursty check-ins bridged by offline progress is still the loop the data supports.")}</InsightBox>
        </div>
      );
    }

    function MethodPanel() {
      return (
        <div>
          <SectionHeading>{t('tab_method', 'Methodology')}</SectionHeading>

          <div style={{ display: "grid", gap: 12 }}>
            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.accent, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_eras_title', 'Era boundaries')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>
                <div><span style={{ color: theme.cyan, fontWeight: 600 }}>{t('pre_label', 'Pre-1.40')}: </span>{t('me_eras_pre', 'Everything up to and including 1.4.0: 0.2.x, 0.3.x, 1.0.x, 1.1.x, 1.2.x, 1.3.x, 1.4.0.')}</div>
                <div style={{ marginTop: 4 }}><span style={{ color: theme.accent, fontWeight: 600 }}>{t('post_label', 'After-1.40')}: </span>{t('me_eras_post', 'Everything from 1.6.0 on: 1.6.0, 1.6.1, 1.7.0, 1.8.0, 1.8.1. No 1.5.x was released, so 1.4.0 is the last build before the overhaul. Economy changes were already live in 1.6.0.')}</div>
              </div>
            </div>

            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.amber, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_excl_title', 'Exclusions')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>{t('me_excl_text', '1.8.2 (in QA, not public) and test1.0 (internal dev sessions) are excluded everywhere. After-1.40 PC_CLIENT traffic is excluded too. Post-overhaul that traffic is overwhelmingly internal dev and QA machines, 163 of 199 raw players at the 1K milestone, so including it would let developer behavior swamp a 36-player cohort. Pre-1.40 keeps all platforms, where PC was about 5% of the era.')}</div>
            </div>

            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.purple, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_agg_title', 'Aggregation method')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>{t('me_agg_text', 'Each CSV row carries (VAL, PLAYERCOUNT). Rows were expanded into PLAYERCOUNT observations of value VAL before computing medians and quartiles. IQR outlier filtering was not applied here, since medians absorb tails on their own. Where a tail still distorts something, it is flagged on the chart.')}</div>
            </div>

            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.red, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_caveats_title', 'Caveats')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>{t('me_caveats_text', "The after-1.40 cohort is about 6× smaller than the pre cohort at the 1K gate (36 against 220) and thins to n=1 by 1T, so the 1B and 1T post values are anecdotal. Session and ad statistics are event-weighted and concentrated in a few heavy users, flagged wherever they are charted. timeElapsed counts wall-clock since install, so long-dormant installs inflate the tails, which is why medians are used throughout. Samples keep accruing on 1.8.1 and the next window adds 1.8.2.")}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─── DASHBOARD ───────────────────────────────────────────────────────
    // Eight tabs in one flat row wrapped into an unreadable block on narrow
    // screens. Grouping them into two labelled rows means a wrap lands inside
    // a group instead of scrambling the whole set, and the labels tell you
    // what a row is for before you tap into it. `short` is used below ~700px.
    const tabGroups = () => [
      {
        id: "release",
        label: t('tabgroup_release', 'What shipped'),
        tabs: [
          { id: "overview",  label: t('tab_overview', 'Overview'),             short: t('tab_overview_short', 'Overview') },
          { id: "economy",   label: t('tab_economy', 'Economy Rebalance'),     short: t('tab_economy_short', 'Economy') },
          { id: "offline",   label: t('tab_offline', 'Offline Bug Fix'),       short: t('tab_offline_short', 'Offline Fix') },
          { id: "analytics", label: t('tab_analytics', 'Analytics Expansion'), short: t('tab_analytics_short', 'Analytics') },
        ],
      },
      {
        id: "players",
        label: t('tabgroup_players', 'What the data shows'),
        tabs: [
          { id: "behavior", label: t('tab_behavior', 'Player Behavior'), short: t('tab_behavior_short', 'Behavior') },
          { id: "geo",      label: t('tab_geo', 'Geo Distribution'),     short: t('tab_geo_short', 'Geo') },
          { id: "ads",      label: t('tab_ads', 'Ads & Sessions'),       short: t('tab_ads_short', 'Ads') },
          { id: "method",   label: t('tab_method', 'Methodology'),       short: t('tab_method_short', 'Method') },
        ],
      },
    ];

    function TabButton({ tab, active, narrow, onSelect }) {
      return (
        <button
          onClick={() => onSelect(tab.id)}
          aria-pressed={active}
          style={{
            background: active ? theme.surfaceHover : "transparent",
            border: `1px solid ${active ? theme.accentDim : theme.border}`,
            padding: narrow ? "9px 10px" : "7px 14px",
            minHeight: narrow ? 38 : 0,          // comfortable touch target
            flex: narrow ? "1 1 auto" : "0 0 auto",
            color: active ? theme.text : theme.textMuted,
            fontSize: narrow ? 11.5 : 12,
            fontWeight: active ? 600 : 400,
            cursor: "pointer",
            borderRadius: 6,
            lineHeight: 1.2,
            transition: "background 0.15s, border-color 0.15s, color 0.15s",
          }}
        >
          {narrow ? tab.short : tab.label}
        </button>
      );
    }

    function Dashboard() {
      const narrow = useMediaQuery("(max-width: 700px)");
      const [activeTab, setActiveTab] = useState("overview");
      const groups = tabGroups();

      // In the portfolio embed the iframe is only a few hundred pixels tall, so
      // switching tabs while scrolled down would otherwise drop you into the
      // middle of the new panel.
      const selectTab = (id) => {
        setActiveTab(id);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const panels = {
        overview: <OverviewPanel />,
        economy: <EconomyPanel />,
        offline: <OfflinePanel />,
        analytics: <AnalyticsPanel />,
        behavior: <BehaviorPanel />,
        geo: <GeoPanel />,
        ads: <AdsSessionsPanel />,
        method: <MethodPanel />,
      };

      return (
        <LayoutContext.Provider value={{ narrow }}>
          <div style={{
            background: theme.bg,
            fontFamily: "'Geist', system-ui, -apple-system, sans-serif",
            color: theme.text,
            padding: narrow ? "12px 10px" : "20px 16px",
          }}>
            {/* Sticky so the nav stays reachable inside a short iframe without
                scrolling back to the top of the document first. */}
            <div style={{
              position: "sticky",
              top: 0,
              zIndex: 5,
              background: theme.bg,
              paddingTop: narrow ? 4 : 2,
              paddingBottom: 10,
              marginBottom: narrow ? 12 : 18,
              borderBottom: `1px solid ${theme.border}`,
            }}>
              {groups.map((group, gi) => (
                <div key={group.id} style={{ marginTop: gi === 0 ? 0 : 8 }}>
                  <div style={{
                    color: theme.textMuted,
                    fontSize: 9.5,
                    textTransform: "uppercase",
                    letterSpacing: 1.2,
                    fontFamily: "'Geist Mono', monospace",
                    marginBottom: 5,
                    opacity: 0.75,
                  }}>
                    {group.label}
                  </div>
                  <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                    {group.tabs.map(tab => (
                      <TabButton
                        key={tab.id}
                        tab={tab}
                        active={activeTab === tab.id}
                        narrow={narrow}
                        onSelect={selectTab}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <div style={{
              background: theme.surface,
              border: `1px solid ${theme.border}`,
              borderRadius: 8,
              padding: narrow ? "14px 12px" : "20px 16px",
            }}>
              {panels[activeTab]}
            </div>

            <div style={{
              marginTop: 16,
              fontSize: 11,
              color: theme.textMuted,
              textAlign: "center",
              lineHeight: 1.5,
            }}>
              {t('footer', "Jhorro Productions · Analytics Dashboard · Data: Unity Analytics (after-1.40 era, July 2026 pull)")}
            </div>
          </div>
        </LayoutContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
