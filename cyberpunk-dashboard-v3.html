    // Cumulative upgrade-purchase cost: base 150 (passive upgrade T1), old 5x vs new 3.5x scaling
    const upgradeCostCurve = (() => {
      const out = [];
      const base = 150;
      for (let n = 0; n <= 10; n++) {
        out.push({
          n,
          old: Math.round(base * Math.pow(5, n)),
          now: Math.round(base * Math.pow(3.5, n)),
        });
      }
      return out;
    })();

    // Offline reward simulation: pre-fix double-application vs post-fix linear with caps.
    // Assumption: baseline CPS=1, 5 offline upgrades owned, time = hours offline.
    // Pre-fix: applied bonus twice → reward = CPS * t * Pow(2,5) * 1.05 (5% rate)  (illustrative)
    // Post-fix: capped at 75% rate, 8h, 2x bonus, linear (1+0.5*n)
    const offlineSim = (() => {
      const out = [];
      const cps = 1, upgrades = 5, baseRate = 0.05;
      const preMult = Math.pow(2, upgrades) * 1.05; // double-application illustration
      const postBonus = Math.min(2.0, 1 + 0.5 * upgrades); // capped at 2x
      const postRate = Math.min(0.75, baseRate * postBonus);
      for (let h = 0.25; h <= 12; h += h < 4 ? 0.25 : 1) {
        const hCapped = Math.min(h, 8);
        out.push({
          h: +h.toFixed(2),
          pre: Math.round(cps * h * 3600 * preMult * baseRate),
          post: Math.round(cps * hCapped * 3600 * postRate),
        });
      }
      return out;
    })();

      if (abs >= 1e9) return `${(v/1e9).toFixed(1)}B`;
      if (abs >= 1e6) return `${(v/1e6).toFixed(1)}M`;
      if (abs >= 1e3) return `${(v/1e3).toFixed(1)}K`;

      if (s < 60) return `${s}s`;
      const m = s / 60;
      if (m < 60) return `${m.toFixed(1)} min`;

            background: theme.surface,
            border: `1px solid ${theme.border}`,
            borderRadius: 8,
            padding: "20px 16px",
          }}>
            {panels[activeTab]}
          </div>

          <div style={{
            marginTop: 16,
            fontSize: 11,
            color: theme.textMuted,
            textAlign: "center",
          }}>
            {t('footer', "Jhorro Productions · Analytics Dashboard v3 · Data: Unity Analytics (after-1.40 era, July 2026 pull)")}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
