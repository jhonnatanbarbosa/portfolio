      const out = [];
      const base = 150;
      for (let n = 0; n <= 10; n++) {
        out.push({
          n,
          old: Math.round(base * Math.pow(5, n)),
          now: Math.round(base * Math.pow(3.5, n)),
        });
      }
      return out;
    })();

    // Offline reward simulation: pre-fix double-application vs post-fix linear with caps.
    // Assumption: baseline CPS=1, 5 offline upgrades owned, time = hours offline.
    // Pre-fix: applied bonus twice → reward = CPS * t * Pow(2,5) * 1.05 (5% rate)  (illustrative)
    // Post-fix: capped at 75% rate, 8h, 2x bonus, linear (1+0.5*n)
    const offlineSim = (() => {
      const out = [];
      const cps = 1, upgrades = 5, baseRate = 0.05;
      const preMult = Math.pow(2, upgrades) * 1.05; // double-application illustration
      const postBonus = Math.min(2.0, 1 + 0.5 * upgrades); // capped at 2x
      const postRate = Math.min(0.75, baseRate * postBonus);
      for (let h = 0.25; h <= 12; h += h < 4 ? 0.25 : 1) {
        const hCapped = Math.min(h, 8);
        out.push({
          h: +h.toFixed(2),
          pre: Math.round(cps * h * 3600 * preMult * baseRate),
          post: Math.round(cps * hCapped * 3600 * postRate),
        });
      }
      return out;
    })();

                <CartesianGrid strokeDasharray="3 3" stroke={theme.border} />
                <XAxis dataKey="milestone" tick={{ fill: theme.textMuted, fontSize: 12 }} />
                <YAxis tickFormatter={(v) => v >= 3600 ? `${(v/3600).toFixed(1)}h` : `${(v/60).toFixed(0)}m`} tick={{ fill: theme.textMuted, fontSize: 11 }} />
                <Tooltip content={<CustomTooltip />} />
                <Bar dataKey="active" name={t('bh_active_label', 'Active time')} fill={chartColors.now} radius={[3,3,0,0]}>
                  <LabelList dataKey="label" position="top" fill={theme.textMuted} fontSize={11} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <NoteBox color={theme.cyan}>{t('bh_n_note', 'Sample sizes per milestone (pre / post): 1K 220/22, 1M 91/9, 1B 25/3, 1T 9/1. Medians chosen over means because both cohorts have long tails. The 1B/1T post values are anecdotal at this n.')}</NoteBox>

          <InsightBox>{t('bh_insight', "Time-to-1K rose ~85% (194s → 360s) and time-to-1M roughly doubled (827s → 1635s). The funnel itself is steep but consistent: ~10% of players who hit 1K reach 1M, ~13% of 1M players reach 1B in the post cohort. The single after-1.40 player who reached 1T did it in ~17 active hours but ~19 hours of real time — confirming the offline cap is doing its job (no more overnight catch-up to top tier). Direction of travel matches the design intent: smoother mid-game, more active engagement, less abuse-via-idle.")}</InsightBox>
        </div>
      );
    }

    function GeoPanel() {
      const totalPost = countryDataPost.reduce((s, c) => s + c.players, 0);
      const totalPre = countryDataPre.reduce((s, c) => s + c.players, 0);
      const timeChart = countryTimeToK.filter(c => c.n >= 1).sort((a, b) => a.med - b.med).map(c => ({ code: c.code, med: c.med, n: c.n, label: `${fmtSec(c.med)}` }));

      return (
        <div>
          <SectionHeading sub={t('geo_intro', "Where players are coming from in each cohort, and how time-to-1K varies by country. Country granularity is best-effort: Unity Analytics provides ISO-2 codes derived from device locale.")}>
            {t('tab_geo', 'Geo Distribution')}
          </SectionHeading>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 22 }}>
            <StatCard label={t('geo_total_post', 'After-1.40 players')} value={totalPost.toString()} sub={t('geo_kpi_sub_post', 'across 1K-1T milestones')} accent={theme.accent} />
            <StatCard label={t('geo_total_pre', 'Pre-1.40 players')} value={totalPre.toString()} sub={t('geo_kpi_sub_pre', 'top-10 countries shown')} accent={theme.cyan} />
            <StatCard label={t('geo_top_post', 'Top after-1.40')} value="US + BR" sub={`${countryDataPost[0].pct + countryDataPost[1].pct}% combined`} accent={theme.text} />
            <StatCard label={t('geo_top_pre', 'Top pre-1.40')} value="US + DE + BR" sub="46% combined" accent={theme.text} />
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 22 }}>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('geo_post_chart', 'After-1.40 cohort')}</div>
              <ResponsiveContainer width="100%" height={240}>
                <BarChart data={countryDataPost} margin={{ top: 10, right: 24, bottom: 10, left: 10 }} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} horizontal={false} />
                  <XAxis type="number" tick={{ fill: theme.textMuted, fontSize: 11 }} />
                  <YAxis dataKey="code" type="category" width={40} tick={{ fill: theme.textMuted, fontSize: 11 }} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="players" name={t('geo_players', 'Players')} fill={chartColors.post} radius={[0,3,3,0]}>
                    <LabelList dataKey="players" position="right" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('geo_pre_chart', 'Pre-1.40 cohort (top 10)')}</div>
              <ResponsiveContainer width="100%" height={240}>
                <BarChart data={countryDataPre} margin={{ top: 10, right: 24, bottom: 10, left: 10 }} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} horizontal={false} />
                  <XAxis type="number" tick={{ fill: theme.textMuted, fontSize: 11 }} />
                  <YAxis dataKey="code" type="category" width={40} tick={{ fill: theme.textMuted, fontSize: 11 }} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="players" name={t('geo_players', 'Players')} fill={chartColors.pre} radius={[0,3,3,0]}>
                    <LabelList dataKey="players" position="right" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div style={{ marginBottom: 4 }}>
            <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4, fontFamily: "'Geist Mono', monospace" }}>{t('geo_time_title', 'Median time-to-1K by country (after-1.40)')}</div>
            <div style={{ color: theme.textMuted, fontSize: 11.5, marginBottom: 10 }}>{t('geo_time_desc', 'Sorted fastest first. Single-player countries marked with n=1 — anecdotal only.')}</div>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={timeChart} margin={{ top: 16, right: 24, bottom: 10, left: 10 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={theme.border} />
                <XAxis dataKey="code" tick={{ fill: theme.textMuted, fontSize: 12 }} />
                <YAxis tickFormatter={(v) => v >= 3600 ? `${(v/3600).toFixed(1)}h` : `${(v/60).toFixed(0)}m`} tick={{ fill: theme.textMuted, fontSize: 11 }} />
                <Tooltip content={<CustomTooltip />} />
                <Bar dataKey="med" name={t('geo_med_time', 'Median time-to-1K')} fill={chartColors.now} radius={[3,3,0,0]}>
                  <LabelList dataKey="label" position="top" fill={theme.textMuted} fontSize={11} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <InsightBox>{t('geo_insight', "The cohort skews more BR-heavy in the post-build than in the pre-build (US+BR went from ~35% to 74%) — likely a reflection of which player segments returned for v1.81. Median time-to-1K varies meaningfully by country: US is fastest among countries with n>1 (~5min), BR roughly 50% slower (~8min). Hard to draw causal conclusions at this n, but worth tracking over time — country differences usually trace back to play habits (commuting cadence, weekday vs weekend) rather than skill.")}</InsightBox>
        </div>
      );
    }

    function AdsSessionsPanel() {
      const adChart = adByCountry.map(c => ({ code: c.code, events: c.events, label: `${c.events} (${c.pct}%)` }));

      return (
        <div>
          <SectionHeading sub={t('ads_intro', "Two new event streams introduced in v1.70: AdWatched5x (rewarded video) and SessionStart. Both are direct windows into engagement — what was previously visible only at milestone snapshots is now sampled per session and per ad watch.")}>
            {t('tab_ads', 'Ads & Sessions')}
          </SectionHeading>

          <div style={{ marginBottom: 22 }}>
            <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('ads_5x_title', '5x ad watches by country (after-1.40)')}</div>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={adChart} margin={{ top: 16, right: 24, bottom: 10, left: 10 }} layout="vertical">
                <CartesianGrid strokeDasharray="3 3" stroke={theme.border} horizontal={false} />
                <XAxis type="number" tick={{ fill: theme.textMuted, fontSize: 11 }} />
                <YAxis dataKey="code" type="category" width={40} tick={{ fill: theme.textMuted, fontSize: 11 }} />
                <Tooltip content={<CustomTooltip />} />
                <Bar dataKey="events" name={t('ads_events', 'Ad events')} fill={chartColors.post} radius={[0,3,3,0]}>
                  <LabelList dataKey="label" position="right" fill={theme.textMuted} fontSize={11} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 22 }}>
            <StatCard label={t('ads_total', 'Total 5x ads watched')} value="146" sub={t('ads_total_sub', 'after-1.40, all countries')} accent={theme.accent} />
            <StatCard label={t('ads_max', 'Single-player max')} value="120" sub={t('ads_max_sub', '1 DE player, 82% of total')} accent={theme.amber} />
            <StatCard label={t('ads_other', 'Other-country events')} value="26" sub={t('ads_other_sub', 'across 4 countries')} accent={theme.text} />
          </div>

          <NoteBox color={theme.amber}>{t('ads_concentration', 'Ad-watch behavior is heavily concentrated: a single German player accounts for 82% of all 5x reward-ad views (lifetimeAdCount sequence runs 1 → 120). The remaining 18% spreads across US (9%), BR (7%), GB (1%), PR (1%). This is a useful signal — the 5x boost is being used as designed (compounding active sessions), but adoption is thin and the new ads-as-progression-lever requires more onboarding visibility.')}</NoteBox>

          <div style={{ marginTop: 24 }}>
            <SectionHeading sub={t('sess_intro', 'SessionStart fires on every app open via the 2-frame coroutine pattern. 27 events captured in the after-1.40 cohort.')}>
              {t('sess_subtitle', 'Session start patterns')}
            </SectionHeading>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 22 }}>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('sess_number_title', 'Session number distribution')}</div>
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={sessionNumberHist} margin={{ top: 16, right: 24, bottom: 10, left: 10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} />
                  <XAxis dataKey="n" tick={{ fill: theme.textMuted, fontSize: 12 }} />
                  <YAxis tick={{ fill: theme.textMuted, fontSize: 12 }} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="count" name={t('sess_events', 'Session opens')} fill={chartColors.post} radius={[3,3,0,0]}>
                    <LabelList dataKey="count" position="top" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div>
              <div style={{ color: theme.textMuted, fontSize: 12, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10, fontFamily: "'Geist Mono', monospace" }}>{t('sess_days_title', 'Days since install (at session)')}</div>
              <ResponsiveContainer width="100%" height={220}>
                <BarChart data={daysSinceInstallHist} margin={{ top: 16, right: 24, bottom: 10, left: 10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={theme.border} />
                  <XAxis dataKey="bucket" tick={{ fill: theme.textMuted, fontSize: 11 }} />
                  <YAxis tick={{ fill: theme.textMuted, fontSize: 12 }} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="count" name={t('sess_events', 'Session opens')} fill={chartColors.cyan || theme.cyan} radius={[3,3,0,0]}>
                    <LabelList dataKey="count" position="top" fill={theme.textMuted} fontSize={11} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 4 }}>
            <StatCard label={t('sess_med_num', 'Median session #')} value="3" sub={t('sess_med_num_sub', 'most events from 2nd-3rd open')} accent={theme.cyan} />
            <StatCard label={t('sess_med_days', 'Median days-since-install')} value="1" sub={t('sess_med_days_sub', '48% of opens on day 0')} accent={theme.cyan} />
            <StatCard label={t('sess_prev_dur', 'Median prev session')} value="2.7 min" sub={t('sess_prev_dur_sub', 'short bursts dominate')} accent={theme.cyan} />
          </div>

          <InsightBox>{t('ads_sess_insight', "Two patterns worth flagging. First: ad watching is a power-user behavior — 82% from one player means current adoption isn't broad. Worth A/B testing more visible 5x prompts to widen the base. Second: the session-start data shows a classic short-burst pattern — median previous session is under 3 minutes, and most app opens happen within the first day or two of install. Players sample the game in quick bites; the offline mechanic is what bridges those bites. Confirms the design assumption that drove the offline-bug fix in the first place.")}</InsightBox>
        </div>
      );
    }

    function MethodPanel() {
      return (
        <div>
          <SectionHeading>{t('tab_method', 'Methodology')}</SectionHeading>

          <div style={{ display: "grid", gap: 12 }}>
            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.accent, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_eras_title', 'Era boundaries')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>
                <div><span style={{ color: theme.cyan, fontWeight: 600 }}>{t('pre_label', 'Pre-1.40')}: </span>{t('me_eras_pre', 'Versions <1.6.0 (0.2.x, 0.3.x, 1.0.x, 1.1.x, 1.2.x, 1.3.x, 1.4.0).')}</div>
                <div style={{ marginTop: 4 }}><span style={{ color: theme.accent, fontWeight: 600 }}>{t('post_label', 'After-1.40')}: </span>{t('me_eras_post', 'Versions 1.6.0, 1.6.1, 1.7.0, 1.8.0, 1.8.1. Economy changes were already live in 1.6.0.')}</div>
              </div>
            </div>

            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.amber, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_excl_title', 'Exclusions')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>{t('me_excl_text', '1.8.2 (in QA, not public), test1.0 (internal dev sessions). No material impact on medians.')}</div>
            </div>

            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.purple, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_agg_title', 'Aggregation method')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>{t('me_agg_text', 'Each CSV row carries (VAL, PLAYERCOUNT). Rows were expanded into PLAYERCOUNT observations of value VAL before computing medians/quartiles. IQR outlier filtering was not applied for this analysis — medians absorb tails naturally; flag where relevant.')}</div>
            </div>

            <div style={{ background: theme.bg, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "12px 14px" }}>
              <div style={{ color: theme.red, fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6, fontFamily: "'Geist Mono', monospace" }}>{t('me_caveats_title', 'Caveats')}</div>
              <div style={{ color: theme.text, fontSize: 13, lineHeight: 1.6 }}>{t('me_caveats_text', "The after-1.40 cohort is ~10× smaller than the pre cohort (current stable build, smaller active player base). Results are directionally valid but confidence intervals are wide. Following v1.81's release, the next analysis window will have larger samples.")}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─── DASHBOARD ───────────────────────────────────────────────────────
    const tabs = [
      { id: "overview", label: t('tab_overview', 'Overview') },
      { id: "economy", label: t('tab_economy', 'Economy Rebalance') },
      { id: "offline", label: t('tab_offline', 'Offline Bug Fix') },
      { id: "analytics", label: t('tab_analytics', 'Analytics Expansion') },
      { id: "behavior", label: t('tab_behavior', 'Player Behavior') },
      { id: "geo", label: t('tab_geo', 'Geo Distribution') },
      { id: "ads", label: t('tab_ads', 'Ads & Sessions') },
      { id: "method", label: t('tab_method', 'Methodology') },
    ];

    function Dashboard() {
      const [activeTab, setActiveTab] = useState("overview");

      const panels = {
        overview: <OverviewPanel />,
        economy: <EconomyPanel />,
        offline: <OfflinePanel />,
        analytics: <AnalyticsPanel />,
        behavior: <BehaviorPanel />,
        geo: <GeoPanel />,
        ads: <AdsSessionsPanel />,
        method: <MethodPanel />,
      };

      return (
        <div style={{
          background: theme.bg,
          fontFamily: "'Geist', system-ui, -apple-system, sans-serif",
          color: theme.text,
          padding: "20px 16px",
        }}>
          <div style={{
            display: "flex",
            gap: 4,
            marginBottom: 20,
            flexWrap: "wrap",
            borderBottom: `1px solid ${theme.border}`,
            paddingBottom: 1,
          }}>
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                style={{
                  background: activeTab === tab.id ? theme.surfaceHover : "transparent",
                  border: "none",
                  borderBottom: activeTab === tab.id ? `2px solid ${theme.accent}` : "2px solid transparent",
                  padding: "7px 14px",
                  color: activeTab === tab.id ? theme.text : theme.textMuted,
                  fontSize: 12,
                  fontWeight: activeTab === tab.id ? 600 : 400,
                  cursor: "pointer",
                  borderRadius: "6px 6px 0 0",
                  transition: "all 0.15s",
                }}
              >
                {tab.label}
              </button>
            ))}
          </div>

          <div style={{
            background: theme.surface,
            border: `1px solid ${theme.border}`,
            borderRadius: 8,
            padding: "20px 16px",
          }}>
            {panels[activeTab]}
          </div>

          <div style={{
            marginTop: 16,
            fontSize: 11,
            color: theme.textMuted,
            textAlign: "center",
          }}>
            {t('footer', "Jhorro Productions · Analytics Dashboard v2 · Data: Unity Analytics (after-1.40)")}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
